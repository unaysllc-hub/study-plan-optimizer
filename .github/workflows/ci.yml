name: Java CI
on:
  push:
  pull_request:
jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: mkdir -p build/classes build/test-classes
      - run: javac -Xlint:all -Werror -d build/classes $(find src/main/java -name '*.java')
      - run: javac -Xlint:all -Werror -cp build/classes -d build/test-classes $(find src/test/java -name '*.java')
      - run: java -ea -cp build/classes:build/test-classes net.unays.planner.OptimizerTest
      - run: java -cp build/classes net.unays.planner.Main tasks.example.csv 90
